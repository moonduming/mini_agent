<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Agent SSE 调试台</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #121a2e;
      --panel-soft: #18223a;
      --border: #293654;
      --text: #e8edf7;
      --muted: #8fa0bd;
      --accent: #6ea8fe;
      --success: #52d3a2;
      --danger: #ff7b87;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, #17284d 0, transparent 34rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .page {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    h1 { margin: 0; font-size: clamp(24px, 4vw, 36px); }
    header p { margin: 8px 0 0; color: var(--muted); }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      white-space: nowrap;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status.streaming .dot {
      background: var(--success);
      box-shadow: 0 0 0 5px rgb(82 211 162 / 12%);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 18px;
    }

    .card {
      background: rgb(18 26 46 / 88%);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 18px 50px rgb(0 0 0 / 22%);
      overflow: hidden;
    }

    .chat {
      min-height: 650px;
      display: flex;
      flex-direction: column;
    }

    .messages {
      flex: 1;
      height: 480px;
      overflow-y: auto;
      padding: 22px;
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 390px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }

    .message {
      max-width: 88%;
      margin-bottom: 16px;
      padding: 13px 15px;
      border-radius: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.user {
      margin-left: auto;
      background: #2559a7;
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      background: var(--panel-soft);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .message.error { border-color: #7c3340; color: #ffd6da; }

    .composer {
      padding: 16px;
      border-top: 1px solid var(--border);
      background: rgb(11 16 32 / 45%);
    }

    textarea, input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0c1325;
      color: var(--text);
      padding: 11px 12px;
      outline: none;
    }

    textarea { min-height: 92px; resize: vertical; font: inherit; }
    textarea:focus, input:focus { border-color: var(--accent); }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 11px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 9px 15px;
      color: white;
      background: #315f9f;
      cursor: pointer;
      font-weight: 650;
    }

    button.secondary { background: #28334c; color: #ced8ea; }
    button.danger { background: #71343f; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    aside { padding: 18px; }
    aside h2 { margin: 0 0 16px; font-size: 16px; }
    label { display: block; margin: 13px 0 6px; color: var(--muted); font-size: 13px; }

    .event-log {
      height: 260px;
      margin-top: 10px;
      padding: 11px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #080d19;
      color: #aebbd0;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .hint { margin-top: 12px; color: var(--muted); font-size: 12px; line-height: 1.6; }

    @media (max-width: 820px) {
      header { align-items: flex-start; flex-direction: column; }
      .layout { grid-template-columns: 1fr; }
      .chat { min-height: 560px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <h1>Mini Agent 调试台</h1>
        <p>通过 POST 请求读取 SSE，实时查看模型输出和原始事件。</p>
      </div>
      <div id="status" class="status"><span class="dot"></span><span>就绪</span></div>
    </header>

    <div class="layout">
      <section class="card chat">
        <div id="messages" class="messages">
          <div id="empty" class="empty">输入问题后点击“发送”<br>响应会随着 SSE 消息实时显示</div>
        </div>
        <div class="composer">
          <textarea id="question" placeholder="例如：分析 2017-05-15 到 2017-05-17 的 ERROR 日志"></textarea>
          <div class="actions">
            <button id="stop" class="danger" disabled>停止</button>
            <button id="send">发送</button>
          </div>
        </div>
      </section>

      <aside class="card">
        <h2>请求配置</h2>
        <label for="endpoint">接口地址</label>
        <input id="endpoint" value="/chat">

        <label for="userId">用户 ID</label>
        <input id="userId" value="akb48">

        <label for="conversationId">会话 ID</label>
        <input id="conversationId">

        <div class="actions">
          <button id="newConversation" class="secondary">新建会话</button>
          <button id="clear" class="secondary">清空页面</button>
        </div>

        <label>原始 SSE 事件</label>
        <div id="eventLog" class="event-log">等待请求……</div>
        <div class="hint">快捷键：Ctrl / Cmd + Enter 发送。停止按钮只中断浏览器连接。</div>
      </aside>
    </div>
  </main>

  <script>
    const elements = {
      messages: document.querySelector('#messages'),
      empty: document.querySelector('#empty'),
      question: document.querySelector('#question'),
      endpoint: document.querySelector('#endpoint'),
      userId: document.querySelector('#userId'),
      conversationId: document.querySelector('#conversationId'),
      eventLog: document.querySelector('#eventLog'),
      status: document.querySelector('#status'),
      send: document.querySelector('#send'),
      stop: document.querySelector('#stop'),
      clear: document.querySelector('#clear'),
      newConversation: document.querySelector('#newConversation'),
    };

    let abortController = null;

    function createConversationId() {
      return crypto.randomUUID();
    }

    function setConversationId(value) {
      elements.conversationId.value = value;
      localStorage.setItem('mini-agent-conversation-id', value);
    }

    function setStatus(text, streaming = false) {
      elements.status.classList.toggle('streaming', streaming);
      elements.status.lastElementChild.textContent = text;
    }

    function appendMessage(role, text = '') {
      elements.empty?.remove();
      const message = document.createElement('div');
      message.className = `message ${role}`;
      message.textContent = text;
      elements.messages.appendChild(message);
      elements.messages.scrollTop = elements.messages.scrollHeight;
      return message;
    }

    function appendEvent(eventName, data) {
      const line = `[${new Date().toLocaleTimeString()}] ${eventName}\n${JSON.stringify(data, null, 2)}\n\n`;
      if (elements.eventLog.textContent === '等待请求……') elements.eventLog.textContent = '';
      elements.eventLog.textContent += line;
      elements.eventLog.scrollTop = elements.eventLog.scrollHeight;
    }

    function contentAsText(content) {
      if (typeof content === 'string') return content;
      if (Array.isArray(content)) {
        return content.map(item => typeof item === 'string' ? item : (item?.text ?? '')).join('');
      }
      return content?.text ?? '';
    }

    function parseEventBlock(block) {
      let eventName = 'message';
      const dataLines = [];
      for (const line of block.split('\n')) {
        if (line.startsWith('event:')) eventName = line.slice(6).trim();
        if (line.startsWith('data:')) dataLines.push(line.slice(5).trimStart());
      }

      const rawData = dataLines.join('\n');
      if (!rawData) return { eventName, data: null };
      try {
        return { eventName, data: JSON.parse(rawData) };
      } catch {
        return { eventName, data: rawData };
      }
    }

    async function sendMessage() {
      const question = elements.question.value.trim();
      if (!question || abortController) return;

      const conversationId = elements.conversationId.value.trim();
      const userId = elements.userId.value.trim();
      if (!conversationId || !userId) {
        setStatus('请填写用户 ID 和会话 ID');
        return;
      }

      localStorage.setItem('mini-agent-user-id', userId);
      appendMessage('user', question);
      const assistantMessage = appendMessage('assistant');
      elements.question.value = '';
      elements.eventLog.textContent = '';
      elements.send.disabled = true;
      elements.stop.disabled = false;
      abortController = new AbortController();
      setStatus('接收中', true);

      try {
        const response = await fetch(elements.endpoint.value.trim() || '/chat', {
          method: 'POST',
          headers: {
            'Accept': 'text/event-stream',
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            question,
            conversation_id: conversationId,
            user_id: userId,
          }),
          signal: abortController.signal,
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${await response.text()}`);
        }
        if (!response.body) throw new Error('浏览器没有收到响应流');

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
          buffer = buffer.replace(/\r\n/g, '\n');

          let boundary;
          while ((boundary = buffer.indexOf('\n\n')) !== -1) {
            const block = buffer.slice(0, boundary);
            buffer = buffer.slice(boundary + 2);
            if (!block.trim() || block.startsWith(':')) continue;

            const { eventName, data } = parseEventBlock(block);
            appendEvent(eventName, data);

            if (eventName === 'message') {
              assistantMessage.textContent += contentAsText(data);
              elements.messages.scrollTop = elements.messages.scrollHeight;
            } else if (eventName === 'error') {
              assistantMessage.classList.add('error');
              assistantMessage.textContent ||= data?.message || '接口执行异常';
              setStatus('执行失败');
            } else if (eventName === 'done') {
              setStatus('完成');
            }
          }

          if (done) break;
        }

        if (!assistantMessage.textContent) assistantMessage.textContent = '未收到文本内容';
        if (elements.status.classList.contains('streaming')) setStatus('连接结束');
      } catch (error) {
        if (error.name === 'AbortError') {
          assistantMessage.textContent ||= '已停止接收';
          setStatus('已停止');
        } else {
          assistantMessage.classList.add('error');
          assistantMessage.textContent ||= String(error);
          appendEvent('client_error', String(error));
          setStatus('连接失败');
        }
      } finally {
        abortController = null;
        elements.send.disabled = false;
        elements.stop.disabled = true;
        elements.question.focus();
      }
    }

    elements.send.addEventListener('click', sendMessage);
    elements.stop.addEventListener('click', () => abortController?.abort());
    elements.question.addEventListener('keydown', event => {
      if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') sendMessage();
    });
    elements.clear.addEventListener('click', () => {
      elements.messages.replaceChildren();
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '页面已清空，会话 ID 保持不变';
      elements.messages.appendChild(empty);
      elements.eventLog.textContent = '等待请求……';
    });
    elements.newConversation.addEventListener('click', () => {
      setConversationId(createConversationId());
      elements.messages.replaceChildren();
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '已创建新会话';
      elements.messages.appendChild(empty);
      elements.eventLog.textContent = '等待请求……';
    });

    elements.userId.value = localStorage.getItem('mini-agent-user-id') || 'debug-user';
    setConversationId(localStorage.getItem('mini-agent-conversation-id') || createConversationId());
  </script>
</body>
</html>
